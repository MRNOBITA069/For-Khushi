<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One Last Thing 💌</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(circle at 20% 20%, #fff0f7, transparent 30%),
        radial-gradient(circle at 80% 80%, #ffc3dd, transparent 35%),
        linear-gradient(135deg, #ffd9e9, #ffb5d4, #ffdce9);

    display: flex;
    justify-content: center;
    align-items: center;

    color: #74334f;
}


/* =========================
   FLOATING BACKGROUND
========================= */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
}

.background span {
    position: absolute;
    bottom: -40px;
    opacity: 0;
    animation: floatUp linear forwards;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: .7;
    }

    100% {
        transform: translateY(-115vh) rotate(360deg);
        opacity: 0;
    }
}


/* =========================
   MAIN PAGE
========================= */

.page {
    position: relative;
    z-index: 5;

    width: min(700px, 94%);
    height: 94vh;

    border-radius: 32px;

    background: rgba(255,255,255,.45);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 25px 70px rgba(160,30,90,.18);

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;
    overflow: hidden;
}

.intro {
    transition:
        opacity .6s ease,
        transform .6s ease;
}

.intro.hide {
    opacity: 0;
    transform: scale(.8);
    pointer-events: none;
}

.title {
    color: #922d5a;

    font-size:
        clamp(28px, 6vw, 44px);

    margin-bottom: 8px;
}

.subtitle {
    color: #80405d;

    font-size:
        clamp(14px, 3vw, 17px);

    margin-bottom: 35px;
}


/* =========================
   ENVELOPE
========================= */

.envelope {
    position: relative;

    width: 330px;
    height: 210px;

    cursor: pointer;

    transition: transform .4s ease;
}

.envelope:hover {
    transform:
        translateY(-7px)
        scale(1.02);
}

.envelope.shake {
    animation:
        envelopeShake .65s ease;
}

@keyframes envelopeShake {

    0%,100% {
        transform: translateX(0);
    }

    20% {
        transform:
            translateX(-8px)
            rotate(-2deg);
    }

    40% {
        transform:
            translateX(8px)
            rotate(2deg);
    }

    60% {
        transform:
            translateX(-6px)
            rotate(-1deg);
    }

    80% {
        transform:
            translateX(6px)
            rotate(1deg);
    }
}


/* =========================
   ENVELOPE BODY
========================= */

.envelope-body {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            145deg,
            #ff9bc6,
            #ff579d
        );

    border-radius:
        8px 8px 15px 15px;

    box-shadow:
        0 20px 40px rgba(170,30,90,.25);

    overflow: hidden;

    z-index: 2;
}

.envelope-body::before {
    content: "";

    position: absolute;

    left: 0;
    bottom: 0;

    width: 0;
    height: 0;

    border-left:
        165px solid #ffb5d3;

    border-top:
        105px solid transparent;

    border-bottom:
        105px solid transparent;
}

.envelope-body::after {
    content: "";

    position: absolute;

    right: 0;
    bottom: 0;

    width: 0;
    height: 0;

    border-right:
        165px solid #ffb5d3;

    border-top:
        105px solid transparent;

    border-bottom:
        105px solid transparent;
}


/* =========================
   FLAP
========================= */

.flap {
    position: absolute;

    top: 0;
    left: 0;

    width: 0;
    height: 0;

    border-left:
        165px solid transparent;

    border-right:
        165px solid transparent;

    border-top:
        115px solid #ff3e8d;

    transform-origin: top center;

    transition:
        transform .8s
        cubic-bezier(.17,.67,.3,1.2);

    z-index: 5;
}

.envelope.open .flap {
    transform: rotateX(180deg);
}


/* =========================
   SEAL
========================= */

.seal {
    position: absolute;

    left: 50%;
    top: 92px;

    transform:
        translateX(-50%);

    width: 52px;
    height: 52px;

    border-radius: 50%;

    background: #ff167d;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 24px;

    box-shadow:
        0 8px 20px rgba(190,30,90,.3);

    z-index: 10;

    transition:
        opacity .4s ease,
        transform .4s ease;
}

.envelope.open .seal {
    opacity: 0;

    transform:
        translateX(-50%)
        scale(.3);
}


/* =========================
   CLICK TEXT
========================= */

.click-text {
    margin-top: 22px;

    color: #9c3262;
    font-weight: bold;

    animation:
        pulse 1.6s
        ease-in-out
        infinite;
}

@keyframes pulse {

    0%,100% {
        opacity: .55;
    }

    50% {
        opacity: 1;
    }
}


/* =========================
   TRANSITION
========================= */

.transition {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle,
            #fff,
            #ffd2e5,
            #ff8fbc
        );

    transform: scale(0);

    border-radius: 50%;

    z-index: 50;

    pointer-events: none;
}

.transition.go {
    animation:
        expandScreen
        1.1s
        cubic-bezier(.7,0,.2,1)
        forwards;
}

@keyframes expandScreen {

    0% {
        transform: scale(0);
    }

    100% {
        transform: scale(2.5);
    }
}


/* =========================
   LETTER SCREEN
========================= */

.letter-screen {
    position: fixed;
    inset: 0;

    z-index: 100;

    padding:
        clamp(18px,4vw,45px);

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        linear-gradient(
            135deg,
            #fff7fb,
            #ffe6f1
        );

    opacity: 0;

    transform: scale(.75);

    pointer-events: none;

    transition:
        opacity .8s ease,
        transform .9s
        cubic-bezier(.17,.67,.3,1.2);
}

.letter-screen.show {
    opacity: 1;

    transform: scale(1);

    pointer-events: auto;
}


/* =========================
   LETTER CARD
========================= */

.letter-card {
    width: min(900px,94vw);

    height: min(88vh,850px);

    padding:
        clamp(25px,5vw,55px);

    border-radius: 25px;

    background:
        rgba(255,255,255,.94);

    box-shadow:
        0 30px 90px rgba(150,30,90,.18);

    border:
        1px solid
        rgba(255,160,200,.45);

    overflow: hidden;

    position: relative;

    transition:
        opacity 1s ease,
        transform 1s ease;
}

.letter-card.fade-out {
    opacity: 0;

    transform:
        scale(.85)
        translateY(-20px);
}

.letter-card::before {
    content: "💗";

    position: absolute;

    top: 18px;
    right: 25px;

    font-size: 25px;

    opacity: .5;
}


/* =========================
   LETTER TITLE
========================= */

.letter-title {
    text-align: center;

    color: #922d5a;

    font-size:
        clamp(25px,5vw,38px);

    margin-bottom: 25px;

    opacity: 0;

    transform: translateY(15px);
}

.letter-screen.show .letter-title {
    animation:
        popText
        .8s
        .3s
        ease
        forwards;
}


/* =========================
   LETTER CONTENT
========================= */

.letter-content {

    height:
        calc(100% - 75px);

    overflow-y: auto;

    scrollbar-width: thin;

    padding-right: 8px;

    text-align: left;
}


/* =========================
   LETTER LINES
========================= */

.letter-line {

    opacity: 0;

    transform:
        translateY(8px);

    margin-bottom: 14px;

    color: #71354f;

    font-size:
        clamp(14px,2vw,17px);

    line-height: 1.6;

    transition:
        opacity .3s ease,
        transform .3s ease;

    white-space: normal;
}

.letter-line.show {
    opacity: 1;

    transform:
        translateY(0);
}


/* =========================
   SPECIAL LINES
========================= */

.letter-line.center {

    text-align: center;

    color: #9c3262;

    font-weight: 700;
}

.letter-line.big {

    text-align: center;

    color: #9c3262;

    font-weight: 800;

    font-size:
        clamp(17px,3vw,22px);

    margin-top: 10px;

    margin-bottom: 20px;
}

.letter-line.signature {

    text-align: right;

    color: #9c3262;

    font-weight: 800;

    font-size: 18px;

    margin-top: 25px;
}


/* =========================
   TITLE ANIMATION
========================= */

@keyframes popText {

    from {
        opacity: 0;

        transform:
            translateY(18px)
            scale(.96);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================
   FINAL HEARTS
========================= */

.final-hearts {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 200;
}

.final-heart {

    position: absolute;

    left: 50%;
    top: 50%;

    font-size: 25px;

    animation:
        heartBurst
        1.8s
        ease
        forwards;
}

@keyframes heartBurst {

    0% {
        transform:
            translate(-50%,-50%)
            scale(.2);

        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1.2);

        opacity: 0;
    }
}


/* =========================
   AFTER LETTER MESSAGE
========================= */

.after-letter {

    position: fixed;

    inset: 0;

    z-index: 300;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle at center,
            #ffffff,
            #ffe8f2 45%,
            #ffc1da
        );

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

.after-letter.show {

    opacity: 1;

    visibility: visible;
}

.after-content {

    width: min(700px,90vw);

    padding: 30px;
}

.after-text {

    color: #922d5a;

    font-size:
        clamp(
            25px,
            6vw,
            48px
        );

    font-weight: 800;

    line-height: 1.35;

    opacity: 0;

    transform:
        translateY(25px)
        scale(.95);
}

.after-text.show {

    animation:
        afterTextIn
        1s
        ease
        forwards;
}

.after-text.second {

    font-size:
        clamp(
            20px,
            4vw,
            32px
        );
}

.after-text.third {

    color: #9c3262;

    font-size:
        clamp(
            20px,
            4.5vw,
            34px
        );
}

@keyframes afterTextIn {

    0% {
        opacity: 0;

        transform:
            translateY(25px)
            scale(.95);
    }

    100% {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================
   GIF ENDING
========================= */

.gif-ending {

    position: fixed;

    inset: 0;

    z-index: 400;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle,
            #fff,
            #ffe7f1,
            #ffc1da
        );

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

.gif-ending.show {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}

.gif-ending-content {

    display: flex;

    flex-direction: column;

    align-items: center;

    padding: 25px;

    animation:
        gifPop
        1s
        ease
        forwards;
}

#endingGif {

    width:
        min(
            280px,
            70vw
        );

    max-height: 280px;

    object-fit: contain;

    border-radius: 20px;

    margin-bottom: 25px;

    filter:
        drop-shadow(
            0 15px 25px
            rgba(150,30,90,.2)
        );
}

.gif-ending h1 {

    color: #922d5a;

    font-size:
        clamp(
            26px,
            6vw,
            48px
        );

    margin-bottom: 12px;
}

.gif-ending p {

    color: #9c3262;

    font-size:
        clamp(
            18px,
            4vw,
            25px
        );

    font-weight: bold;
}

@keyframes gifPop {

    0% {
        opacity: 0;

        transform:
            scale(.5)
            translateY(30px);
    }

    70% {
        transform:
            scale(1.05)
            translateY(0);
    }

    100% {
        opacity: 1;

        transform:
            scale(1);
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width:550px) {

    .envelope {

        width: 285px;

        height: 180px;
    }

    .flap {

        border-left-width:
            142.5px;

        border-right-width:
            142.5px;

        border-top-width:
            100px;
    }

    .envelope-body::before {

        border-left-width:
            142.5px;

        border-top-width:
            90px;

        border-bottom-width:
            90px;
    }

    .envelope-body::after {

        border-right-width:
            142.5px;

        border-top-width:
            90px;

        border-bottom-width:
            90px;
    }

    .seal {
        top: 78px;
    }

    .letter-card {

        height: 90vh;

        border-radius: 20px;

        padding: 22px;
    }
}

</style>
</head>

<body>


<!-- =========================
     BACKGROUND
========================= -->

<div
    class="background"
    id="background">
</div>


<!-- =========================
     TRANSITION
========================= -->

<div
    class="transition"
    id="transition">
</div>


<!-- =========================
     ENVELOPE PAGE
========================= -->

<div class="page">

    <div
        class="intro"
        id="intro">

        <h1 class="title">
            One Last Thing... 💌
        </h1>

        <p class="subtitle">
            I wanted to tell you something.
        </p>

        <div
            class="envelope"
            id="envelope">

            <div
                class="envelope-body">
            </div>

            <div
                class="flap">
            </div>

            <div
                class="seal">
                ❤️
            </div>

        </div>

        <div class="click-text">
            Click the envelope 💌
        </div>

    </div>

</div>


<!-- =========================
     LETTER
========================= -->

<section
    class="letter-screen"
    id="letterScreen">

    <div
        class="letter-card"
        id="letterCard">

        <h2 class="letter-title">
            Dear Khushi, 💗
        </h2>

        <div
            class="letter-content"
            id="letterContent">
        </div>

    </div>

</section>


<!-- =========================
     HEARTS
========================= -->

<div
    class="final-hearts"
    id="finalHearts">
</div>


<!-- =========================
     AFTER LETTER
========================= -->

<div
    class="after-letter"
    id="afterLetter">

    <div class="after-content">

        <div
            class="after-text"
            id="afterText1">

            That's all I wanted to say.

        </div>

        <div
            class="after-text second"
            id="afterText2">

            Except... maybe one more thing.

        </div>

        <div
            class="after-text third"
            id="afterText3">

            Stay the same. Keep smiling.<br>
            And don't forget your idiot Nobita. 🐼❤️

        </div>

    </div>

</div>


<!-- =========================
     GIF ENDING
========================= -->

<div
    class="gif-ending"
    id="gifEnding">

    <div class="gif-ending-content">

        <img
            id="endingGif"
            src="assets/gifs/panda6.gif"
            alt="Cute panda">

        <h1>
            That's all, idiot. ❤️
        </h1>

        <p>
            — Nobita 🐼
        </p>

    </div>

</div>


<script>


/* =========================
   LETTER CONTENT
========================= */

const letterLines = [

    {
        text:
            "So... you finally made it here. 😂"
    },

    {
        text:
            "First of all, I would like to officially complain about something."
    },

    {
        text:
            "You call me Yadav Ji, Ostrich, Pagal, and Idiot..."
    },

    {
        text:
            "And somehow, I still stayed. 😭"
    },

    {
        text:
            "And then there is my famous..."
    },

    {
        text:
            '"I hate you."',
        className:
            "center"
    },

    {
        text:
            "And you always reply:"
    },

    {
        text:
            '"I love you too." 😂❤️',
        className:
            "center"
    },

    {
        text:
            "Honestly, that's probably the most us thing ever."
    },

    {
        text:
            "I don't always know how to say the important things properly. Most of the time, I'll probably make a stupid joke, annoy you, call you something random, or just say I hate you."
    },

    {
        text:
            "But that's just me being me."
    },

    {
        text:
            "You've listened to my nonsense, tolerated my stupidity, laughed with me, argued with me, and stayed through all of it."
    },

    {
        text:
            "And for that..."
    },

    {
        text:
            "Thank you. 🐼💗",
        className:
            "big"
    },

    {
        text:
            "I don't know what the future looks like."
    },

    {
        text:
            "I don't know where life takes us, how things change, or where we'll both end up."
    },

    {
        text:
            "But I do know that I'm genuinely grateful for every little moment we've shared."
    },

    {
        text:
            "The random conversations."
    },

    {
        text:
            "The stupid arguments."
    },

    {
        text:
            "The jokes that make absolutely no sense to anyone else."
    },

    {
        text:
            "All those little moments that probably don't seem important at the time..."
    },

    {
        text:
            "but somehow become the moments we remember."
    },

    {
        text:
            "And if I don't say it enough, I want you to know that having you in my life means more to me than I can properly put into words."
    },

    {
        text:
            "I'm really glad I met you."
    },

    {
        text:
            "I'm really glad I got to know you."
    },

    {
        text:
            "And most of all..."
    },

    {
        text:
            "I'm really glad you stayed. 🐼❤️",
        className:
            "big"
    },

    {
        text:
            "So Khushi..."
    },

    {
        text:
            "From your Yadav Ji, Ostrich, Pagal, Idiot Nobita—"
    },

    {
        text:
            "I hate you. ❤️",
        className:
            "big"
    },

    {
        text:
            "And thank you..."
    },

    {
        text:
            "for being a part of my life."
    },

    {
        text:
            "— Nobita ❤️",
        className:
            "signature"
    }

];


/* =========================
   ELEMENTS
========================= */

const envelope =
    document.getElementById(
        "envelope"
    );

const intro =
    document.getElementById(
        "intro"
    );

const transition =
    document.getElementById(
        "transition"
    );

const letterScreen =
    document.getElementById(
        "letterScreen"
    );

const letterCard =
    document.getElementById(
        "letterCard"
    );

const letterContent =
    document.getElementById(
        "letterContent"
    );

const finalHearts =
    document.getElementById(
        "finalHearts"
    );

const afterLetter =
    document.getElementById(
        "afterLetter"
    );

const afterText1 =
    document.getElementById(
        "afterText1"
    );

const afterText2 =
    document.getElementById(
        "afterText2"
    );

const afterText3 =
    document.getElementById(
        "afterText3"
    );

const gifEnding =
    document.getElementById(
        "gifEnding"
    );

const endingGif =
    document.getElementById(
        "endingGif"
    );


/* =========================
   CREATE LETTER LINES
========================= */

letterLines.forEach(
    function(item) {

        const line =
            document.createElement(
                "div"
            );

        line.className =
            "letter-line";

        if (item.className) {

            line.classList.add(
                item.className
            );

        }

        line.textContent =
            item.text;

        letterContent.appendChild(
            line
        );

    }
);


const lines =
    document.querySelectorAll(
        ".letter-line"
    );


/* =========================
   ENVELOPE CLICK
========================= */

let clicked = false;

envelope.addEventListener(
    "click",
    function() {

        if (clicked) {
            return;
        }

        clicked = true;

        envelope.classList.add(
            "shake"
        );

        setTimeout(
            function() {

                envelope.classList.add(
                    "open"
                );

            },
            350
        );

        setTimeout(
            function() {

                intro.classList.add(
                    "hide"
                );

                transition.classList.add(
                    "go"
                );

            },
            850
        );

        setTimeout(
            function() {

                letterScreen.classList.add(
                    "show"
                );

            },
            1250
        );

        setTimeout(
            function() {

                revealLines();

            },
            2050
        );

    }
);


/* =========================
   TYPEWRITER
========================= */

function revealLines() {

    let lineIndex = 0;


    function showNextLine() {

        if (
            lineIndex >=
            lines.length
        ) {

            setTimeout(
                heartExplosion,
                1000
            );

            return;
        }


        const line =
            lines[lineIndex];

        const text =
            line.textContent;

        line.textContent = "";

        line.classList.add(
            "show"
        );

        let characterIndex = 0;


        function typeCharacter() {

            if (
                characterIndex >=
                text.length
            ) {

                lineIndex++;

                setTimeout(
                    showNextLine,
                    500
                );

                return;
            }


            line.textContent +=
                text.charAt(
                    characterIndex
                );

            characterIndex++;


            line.scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });


            setTimeout(
                typeCharacter,
                45
            );

        }


        typeCharacter();

    }


    showNextLine();

}


/* =========================
   HEART EXPLOSION
========================= */

function heartExplosion() {

    const hearts = [
        "❤️",
        "💗",
        "💕",
        "💖",
        "✨",
        "🌸"
    ];


    for (
        let i = 0;
        i < 25;
        i++
    ) {

        setTimeout(
            function() {

                const heart =
                    document.createElement(
                        "span"
                    );

                heart.className =
                    "final-heart";

                heart.textContent =
                    hearts[
                        Math.floor(
                            Math.random() *
                            hearts.length
                        )
                    ];


                const angle =
                    Math.random() *
                    Math.PI *
                    2;

                const distance =
                    100 +
                    Math.random() *
                    300;


                heart.style.setProperty(
                    "--x",
                    Math.cos(angle) *
                    distance +
                    "px"
                );

                heart.style.setProperty(
                    "--y",
                    Math.sin(angle) *
                    distance +
                    "px"
                );


                finalHearts.appendChild(
                    heart
                );


                setTimeout(
                    function() {

                        heart.remove();

                    },
                    1900
                );

            },
            i * 70
        );

    }


    /*
     * Wait for hearts,
     * then fade the letter.
     */

    setTimeout(
        fadeLetter,
        2300
    );

}


/* =========================
   FADE LETTER
========================= */

function fadeLetter() {

    letterCard.classList.add(
        "fade-out"
    );


    setTimeout(
        function() {

            letterScreen.classList.remove(
                "show"
            );

            showAfterLetter();

        },
        1000
    );

}


/* =========================
   AFTER LETTER TEXT
========================= */

function showAfterLetter() {

    afterLetter.classList.add(
        "show"
    );


    /*
     * First message
     */

    setTimeout(
        function() {

            afterText1.classList.add(
                "show"
            );

        },
        700
    );


    /*
     * Second message
     */

    setTimeout(
        function() {

            afterText1.classList.remove(
                "show"
            );

            afterText2.classList.add(
                "show"
            );

        },
        3000
    );


    /*
     * Third message
     */

    setTimeout(
        function() {

            afterText2.classList.remove(
                "show"
            );

            afterText3.classList.add(
                "show"
            );

        },
        5700
    );


    /*
     * Then GIF finale
     */

    setTimeout(
        function() {

            afterLetter.classList.remove(
                "show"
            );

            showGifEnding();

        },
        9500
    );

}


/* =========================
   GIF FINALE
========================= */

function showGifEnding() {

    gifEnding.classList.add(
        "show"
    );


    /*
     * First GIF
     */

    endingGif.src =
        "assets/gifs/panda6.gif";


    /*
     * Second GIF
     */

    setTimeout(
        function() {

            endingGif.src =
                "assets/gifs/panda7.gif";

        },
        3500
    );

}


/* =========================
   BACKGROUND PARTICLES
========================= */

const symbols = [
    "💗",
    "💕",
    "💖",
    "🌸",
    "✨",
    "🌷"
];


function createParticle() {

    const particle =
        document.createElement(
            "span"
        );

    particle.textContent =
        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];

    particle.style.left =
        Math.random() *
        100 +
        "%";

    particle.style.fontSize =
        (
            15 +
            Math.random() *
            18
        ) +
        "px";

    const duration =
        7 +
        Math.random() *
        7;

    particle.style.animationDuration =
        duration +
        "s";

    document
        .getElementById(
            "background"
        )
        .appendChild(
            particle
        );

    setTimeout(
        function() {

            particle.remove();

        },
        (duration + 1) * 1000
    );

}


setInterval(
    createParticle,
    650
);


for (
    let i = 0;
    i < 8;
    i++
) {

    setTimeout(
        createParticle,
        i * 200
    );

}

</script>
