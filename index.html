<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For Khushi ❤️</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- Floating hearts and flowers -->
    <div
        class="floating-elements"
        id="floatingElements"
    ></div>


    <!-- Main page -->
    <main class="page">


        <!-- GIF -->
        <div class="gif-container">

            <img
                id="reactionGif"
                src="assets\gifs\panda7.gif"
                alt="Cute panda reaction"
            >

        </div>


        <!-- Fixed title -->
        <h1 id="title">

            Hey Khushi...
            <span class="eyes">👀</span>

        </h1>


        <!-- Changing question -->
        <p id="question">

            Are you ready for this?

        </p>


        <!-- Buttons -->
        <div class="buttons">


            <button
                id="yesButton"
                class="yes-button"
            >
                YES ✨
            </button>


            <button
                id="noButton"
                class="no-button"
            >
                NO 😭
            </button>


        </div>


    </main>


    <script src="script.js"></script>

</body>

</html>
