<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Khushi 💗</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 15px;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    #fff2f8,
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    #ffc2dc,
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #ffd9e9,
                    #ffb8d5,
                    #ffdcea
                );

            color: #74334f;
        }


        /* =========================================
           FLOATING BACKGROUND
        ========================================= */

        .background {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        .background span {

            position: absolute;

            bottom: -40px;

            animation:
                floatUp
                linear
                forwards;

            opacity: 0;
        }


        @keyframes floatUp {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg)
                    scale(.7);

                opacity: 0;
            }

            15% {

                opacity: .7;
            }

            100% {

                transform:
                    translateY(-115vh)
                    rotate(360deg)
                    scale(1.1);

                opacity: 0;
            }
        }


        /* =========================================
           CARD
        ========================================= */

        .card {

            position: relative;

            z-index: 2;

            width:
                min(
                    650px,
                    100%
                );

            height: 96vh;

            max-height: 96vh;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 20px;

            border-radius: 32px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .42
                );

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .65
                );

            box-shadow:
                0 25px 70px
                rgba(
                    180,
                    40,
                    100,
                    .18
                );
        }


        /* =========================================
           HEADER
        ========================================= */

        .small-title {

            font-size: 13px;

            font-weight: 800;

            letter-spacing: 1px;

            color: #b43e70;

            margin-bottom: 5px;
        }


        h1 {

            font-size:
                clamp(
                    30px,
                    6vw,
                    44px
                );

            color: #922d5a;

            margin-bottom: 6px;
        }


        .intro {

            font-size:
                clamp(
                    15px,
                    3.5vw,
                    18px
                );

            color: #80405d;

            line-height: 1.4;

            max-width: 500px;

            margin-bottom: 8px;
        }


        /* =========================================
           GIFT AREA
        ========================================= */

        .gift-area {

            position: relative;

            width: 350px;

            height: 350px;

            display: flex;

            justify-content: center;

            align-items: flex-end;

            margin-bottom: 5px;
        }


        /* =========================================
           SPARKLES
        ========================================= */

        .sparkles {

            position: absolute;

            inset: 0;

            pointer-events: none;

            z-index: 20;
        }


        .sparkle {

            position: absolute;

            font-size: 25px;

            opacity: 0;

            transform:
                scale(.2);
        }


        .sparkle.show {

            animation:
                sparklePop
                .9s
                ease-out
                forwards;
        }


        @keyframes sparklePop {

            0% {

                opacity: 0;

                transform:
                    translate(
                        0,
                        30px
                    )
                    scale(.2);
            }

            40% {

                opacity: 1;
            }

            100% {

                opacity: 0;

                transform:
                    translate(
                        var(--x),
                        var(--y)
                    )
                    scale(1.2)
                    rotate(180deg);
            }
        }


        /* =========================================
           GIFT
        ========================================= */

        .gift {

            position: absolute;

            left: 50%;

            bottom: 15px;

            transform:
                translateX(-50%);

            width: 220px;

            height: 180px;

            cursor: pointer;

            animation:
                giftIdle
                2.2s
                ease-in-out
                infinite;

            transform-origin:
                bottom center;

            z-index: 5;
        }


        @keyframes giftIdle {

            0%,
            100% {

                transform:
                    translateX(-50%)
                    translateY(0)
                    rotate(0deg);
            }

            50% {

                transform:
                    translateX(-50%)
                    translateY(-8px)
                    rotate(-1deg);
            }
        }


        /* =========================================
           BOX
        ========================================= */

        .box {

            position: absolute;

            left: 10px;

            bottom: 0;

            width: 200px;

            height: 130px;

            border-radius:
                8px 8px 18px 18px;

            background:
                linear-gradient(
                    135deg,
                    #ff8fbc,
                    #ff4f96
                );

            box-shadow:
                0 20px 35px
                rgba(
                    180,
                    30,
                    90,
                    .25
                );

            overflow: hidden;

            z-index: 2;
        }


        /* Vertical ribbon */

        .box::before {

            content: "";

            position: absolute;

            left: 50%;

            top: 0;

            transform:
                translateX(-50%);

            width: 35px;

            height: 100%;

            background:
                #ffdaea;
        }


        /* Horizontal ribbon */

        .box::after {

            content: "";

            position: absolute;

            left: 0;

            top: 42%;

            width: 100%;

            height: 28px;

            background:
                #ffdaea;
        }


        /* =========================================
           LID
        ========================================= */

        .lid {

            position: absolute;

            left: 0;

            top: 35px;

            width: 220px;

            height: 50px;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #ffaad0,
                    #ff5ba0
                );

            box-shadow:
                0 8px 15px
                rgba(
                    160,
                    30,
                    90,
                    .2
                );

            z-index: 7;

            transition:
                transform
                .8s
                cubic-bezier(
                    .17,
                    .67,
                    .3,
                    1.3
                );
        }


        .lid::before {

            content: "";

            position: absolute;

            left: 50%;

            top: 0;

            transform:
                translateX(-50%);

            width: 35px;

            height: 100%;

            background:
                #ffdaea;
        }


        /* =========================================
           BOW
        ========================================= */

        .bow {

            position: absolute;

            z-index: 10;

            top: 3px;

            left: 50%;

            transform:
                translateX(-50%);

            width: 75px;

            height: 65px;

            transition:
                transform
                .8s
                cubic-bezier(
                    .17,
                    .67,
                    .3,
                    1.3
                );
        }


        .bow-left,
        .bow-right {

            position: absolute;

            top: 12px;

            width: 43px;

            height: 38px;

            background:
                #ff3f91;

            border-radius:
                70% 20% 70% 20%;
        }


        .bow-left {

            left: 0;

            transform:
                rotate(25deg);
        }


        .bow-right {

            right: 0;

            transform:
                scaleX(-1)
                rotate(25deg);
        }


        .bow-center {

            position: absolute;

            left: 50%;

            top: 17px;

            transform:
                translateX(-50%);

            width: 23px;

            height: 28px;

            border-radius: 7px;

            background:
                #ff207f;

            z-index: 2;
        }


        /* =========================================
           OPEN GIFT
        ========================================= */

        .gift.open {

            animation: none;
        }


        .gift.open .lid {

            transform:
                translateY(-125px)
                rotate(-8deg);
        }


        .gift.open .bow {

            transform:
                translate(
                    -50%,
                    -125px
                )
                rotate(-12deg);
        }


        .gift.open .box {

            box-shadow:
                0 0 30px
                rgba(
                    255,
                    70,
                    160,
                    .55
                ),
                0 20px 35px
                rgba(
                    180,
                    30,
                    90,
                    .25
                );
        }


        /* =========================================
           COMPLIMENT POPUP
        ========================================= */

        .compliment {

            position: absolute;

            z-index: 15;

            left: 50%;

            top: 135px;

            transform:
                translate(-50%, 55px)
                scale(.25);

            width:
                min(
                    500px,
                    92%
                );

            min-height: 90px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity .25s ease,
                transform .7s cubic-bezier(
                    .17,
                    .67,
                    .3,
                    1.35
                );
        }


        .compliment.show {

            opacity: 1;

            transform:
                translate(-50%, -95px)
                scale(1);
        }


        .compliment-text {

            position: relative;

            padding:
                13px 21px;

            border-radius: 20px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .97
                );

            color: #9c3262;

            font-size:
                clamp(
                    17px,
                    4vw,
                    23px
                );

            font-weight: 800;

            line-height: 1.4;

            box-shadow:
                0 15px 35px
                rgba(
                    180,
                    40,
                    100,
                    .2
                );

            border:
                2px solid
                rgba(
                    255,
                    130,
                    180,
                    .45
                );
        }


        /* Little pointer toward the gift */

        .compliment-text::after {

            content: "";

            position: absolute;

            left: 50%;

            bottom: -12px;

            transform:
                translateX(-50%);

            width: 0;

            height: 0;

            border-left:
                12px solid transparent;

            border-right:
                12px solid transparent;

            border-top:
                14px solid
                rgba(
                    255,
                    255,
                    255,
                    .97
                );
        }


        .compliment-number {

            margin-top: 7px;

            font-size: 11px;

            font-weight: 700;

            color: #ae5a79;
        }


        /* =========================================
           BUTTON
        ========================================= */

        .button {

            border: none;

            border-radius: 50px;

            padding:
                12px 30px;

            background:
                linear-gradient(
                    135deg,
                    #ff3f91,
                    #ff79b6
                );

            color: white;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 10px 25px
                rgba(
                    255,
                    50,
                    140,
                    .25
                );

            transition:
                transform .25s ease,
                box-shadow .25s ease;
        }


        .button:hover {

            transform:
                translateY(-3px)
                scale(1.04);

            box-shadow:
                0 15px 30px
                rgba(
                    255,
                    50,
                    140,
                    .32
                );
        }


        .button:active {

            transform:
                scale(.95);
        }


        /* =========================================
           FINAL
        ========================================= */

        .final {

            display: none;

            animation:
                finalAppear
                .7s
                ease;
        }


        .final.show {

            display: block;
        }


        @keyframes finalAppear {

            0% {

                opacity: 0;

                transform:
                    scale(.8)
                    translateY(20px);
            }

            100% {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);
            }
        }


        .final h2 {

            font-size:
                clamp(
                    27px,
                    6vw,
                    40px
                );

            color: #9c3262;

            margin-bottom: 10px;
        }


        .final p {

            color: #80405d;

            font-size: 17px;

            line-height: 1.55;

            margin-bottom: 12px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 550px) {

            .card {

                height: 97vh;

                padding: 12px;

                border-radius: 25px;
            }


            .gift-area {

                width: 310px;

                height: 310px;
            }


            .gift {

                transform:
                    translateX(-50%)
                    scale(.9);

                transform-origin:
                    bottom center;
            }


            .compliment {

                width: 285px;

                top: 120px;
            }


            .compliment.show {

                transform:
                    translate(-50%, -80px)
                    scale(.9);
            }

        }


        /* =========================================
           SHORT SCREENS
        ========================================= */

        @media (max-height: 700px) {

            .gift-area {

                height: 260px;
            }


            .gift {

                transform:
                    translateX(-50%)
                    scale(.75);
            }


            .compliment {

                top: 105px;
            }


            .compliment.show {

                transform:
                    translate(-50%, -70px)
                    scale(.8);
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         BACKGROUND
    ========================================= -->

    <div
        class="background"
        id="background"
    ></div>


    <!-- =========================================
         MAIN CARD
    ========================================= -->

    <main class="card">


        <div class="small-title">
            JUST ONE MORE THING... 💗
        </div>


        <h1>
            Khushi... 👀
        </h1>


        <p class="intro">
            I have something for you.
            But you're going to have to open it. 😌
        </p>


        <!-- =====================================
             GIFT AREA
        ====================================== -->

        <div class="gift-area">


            <!-- SPARKLES -->

            <div
                class="sparkles"
                id="sparkles"
            >

                <span
                    class="sparkle"
                    style="
                        left: 40%;
                        top: 30%;
                        --x: -100px;
                        --y: -100px;
                    "
                >
                    ✨
                </span>


                <span
                    class="sparkle"
                    style="
                        left: 55%;
                        top: 30%;
                        --x: 100px;
                        --y: -120px;
                    "
                >
                    ✨
                </span>


                <span
                    class="sparkle"
                    style="
                        left: 50%;
                        top: 35%;
                        --x: 0px;
                        --y: -150px;
                    "
                >
                    💗
                </span>


                <span
                    class="sparkle"
                    style="
                        left: 45%;
                        top: 40%;
                        --x: -130px;
                        --y: -40px;
                    "
                >
                    💕
                </span>


                <span
                    class="sparkle"
                    style="
                        left: 55%;
                        top: 40%;
                        --x: 130px;
                        --y: -50px;
                    "
                >
                    ✨
                </span>

            </div>


            <!-- =================================
                 GIFT
            ================================== -->

            <div
                class="gift"
                id="gift"
            >

                <div class="box"></div>

                <div class="lid"></div>

                <div class="bow">

                    <div class="bow-left"></div>

                    <div class="bow-right"></div>

                    <div class="bow-center"></div>

                </div>

            </div>


            <!-- =================================
                 POP-UP COMPLIMENT
            ================================== -->

            <div
                class="compliment"
                id="compliment"
            >

                <div
                    class="compliment-text"
                    id="complimentText"
                ></div>


                <div
                    class="compliment-number"
                    id="complimentNumber"
                ></div>

            </div>


        </div>


        <!-- =====================================
             BUTTON
        ====================================== -->

        <button
            class="button"
            id="actionButton"
        >
            OPEN THE GIFT 🎁
        </button>


        <!-- =====================================
             FINAL
        ====================================== -->

        <div
            class="final"
            id="final"
        >

            <h2>
                That's not even all of it. 🥹
            </h2>


            <p>
                I could probably fill this entire
                website telling you how amazing
                you are.
            </p>


            <p>
                But there's something else I want
                you to read...
            </p>


            <button
                class="button"
                onclick="goToPage4()"
            >
                ONE MORE THING 💌
            </button>

        </div>


    </main>


    <script>


        /* =========================================
           COMPLIMENTS
        ========================================= */

        const compliments = [

            "You're genuinely one of the kindest people I know. 🌸",

            "You have this amazing way of making people feel comfortable around you. 💗",

            "You somehow make even the most random moments memorable. ✨",

            "You listen when it actually matters... and that means more than you know. 🫂",

            "You tolerate my nonsense way more than you probably should. 😂",

            "And most importantly... you stayed. 💗"

        ];


        /* =========================================
           VARIABLES
        ========================================= */

        let current = 0;

        let opened = false;


        const gift =
            document.getElementById(
                "gift"
            );


        const actionButton =
            document.getElementById(
                "actionButton"
            );


        const compliment =
            document.getElementById(
                "compliment"
            );


        const complimentText =
            document.getElementById(
                "complimentText"
            );


        const complimentNumber =
            document.getElementById(
                "complimentNumber"
            );


        const final =
            document.getElementById(
                "final"
            );


        const sparkles =
            document.querySelectorAll(
                ".sparkle"
            );


        /* =========================================
           BUTTON
        ========================================= */

        actionButton.addEventListener(
            "click",
            function () {

                if (!opened) {

                    opened = true;

                    gift.classList.add(
                        "open"
                    );

                    actionButton.textContent =
                        "NEXT 💗";


                    sparkles.forEach(
                        sparkle => {

                            sparkle.classList.remove(
                                "show"
                            );

                            void sparkle.offsetWidth;

                            sparkle.classList.add(
                                "show"
                            );

                        }
                    );


                    setTimeout(
                        showNextCompliment,
                        450
                    );

                }

                else {

                    showNextCompliment();

                }

            }
        );


        /* =========================================
           SHOW COMPLIMENT
        ========================================= */

        function showNextCompliment() {

            if (
                current >=
                compliments.length
            ) {

                finishPage();

                return;

            }


            compliment.classList.remove(
                "show"
            );


            setTimeout(
                function () {

                    complimentText.textContent =
                        compliments[
                            current
                        ];


                    complimentNumber.textContent =
                        `${current + 1} / ${compliments.length}`;


                    compliment.classList.add(
                        "show"
                    );


                    createBurst();

                },
                150
            );


            current++;


            if (
                current >=
                compliments.length
            ) {

                actionButton.textContent =
                    "FINISH 💗";

            }

        }


        /* =========================================
           FINISH
        ========================================= */

        function finishPage() {

            actionButton.style.display =
                "none";


            compliment.classList.remove(
                "show"
            );


            setTimeout(
                function () {

                    final.classList.add(
                        "show"
                    );

                },
                300
            );


            createBigBurst();

        }


        /* =========================================
           PAGE 4
        ========================================= */

        function goToPage4() {

            window.location.href =
                "page4.html";

        }


        /* =========================================
           SMALL HEART BURST
        ========================================= */

        function createBurst() {

            const symbols = [
                "💗",
                "💕",
                "✨",
                "🌸"
            ];


            for (
                let i = 0;
                i < 8;
                i++
            ) {

                const item =
                    document.createElement(
                        "span"
                    );


                item.textContent =
                    symbols[
                        Math.floor(
                            Math.random() *
                            symbols.length
                        )
                    ];


                item.style.position =
                    "fixed";


                item.style.left =
                    "50%";


                item.style.top =
                    "45%";


                item.style.zIndex =
                    "50";


                item.style.fontSize =
                    "20px";


                item.style.pointerEvents =
                    "none";


                document.body.appendChild(
                    item
                );


                const angle =
                    (
                        Math.PI * 2 * i
                    ) / 8;


                const distance =
                    80 +
                    Math.random() *
                    60;


                const x =
                    Math.cos(angle) *
                    distance;


                const y =
                    Math.sin(angle) *
                    distance;


                item.animate(
                    [

                        {
                            transform:
                                "translate(-50%, -50%) scale(.2)",

                            opacity: 0
                        },

                        {
                            transform:
                                `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(1.2)`,

                            opacity: 1
                        },

                        {
                            transform:
                                `translate(calc(-50% + ${x * 1.5}px), calc(-50% + ${y * 1.5}px)) scale(.6)`,

                            opacity: 0
                        }

                    ],
                    {

                        duration: 900,

                        easing: "ease-out"

                    }
                );


                setTimeout(
                    function () {

                        item.remove();

                    },
                    950
                );

            }

        }


        /* =========================================
           BIG FINAL BURST
        ========================================= */

        function createBigBurst() {

            const symbols = [

                "💗",
                "💕",
                "💖",
                "✨",
                "🌸",
                "🎀",
                "💐"

            ];


            for (
                let i = 0;
                i < 25;
                i++
            ) {

                setTimeout(
                    function () {

                        const item =
                            document.createElement(
                                "span"
                            );


                        item.textContent =
                            symbols[
                                Math.floor(
                                    Math.random() *
                                    symbols.length
                                )
                            ];


                        item.style.position =
                            "fixed";


                        item.style.left =
                            "50%";


                        item.style.top =
                            "45%";


                        item.style.zIndex =
                            "50";


                        item.style.fontSize =
                            (
                                18 +
                                Math.random() *
                                18
                            ) +
                            "px";


                        item.style.pointerEvents =
                            "none";


                        document.body.appendChild(
                            item
                        );


                        const angle =
                            Math.random() *
                            Math.PI *
                            2;


                        const distance =
                            100 +
                            Math.random() *
                            180;


                        const x =
                            Math.cos(angle) *
                            distance;


                        const y =
                            Math.sin(angle) *
                            distance;


                        item.animate(
                            [

                                {
                                    transform:
                                        "translate(-50%, -50%) scale(.2)",

                                    opacity: 0
                                },

                                {
                                    transform:
                                        `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(1.2)`,

                                    opacity: 1
                                },

                                {
                                    transform:
                                        `translate(calc(-50% + ${x * 1.3}px), calc(-50% + ${y * 1.3}px)) scale(.6)`,

                                    opacity: 0
                                }

                            ],
                            {

                                duration: 1200,

                                easing:
                                    "cubic-bezier(.17,.67,.3,1)"

                            }
                        );


                        setTimeout(
                            function () {

                                item.remove();

                            },
                            1250
                        );

                    },
                    i * 35
                );

            }

        }


        /* =========================================
           BACKGROUND PARTICLES
        ========================================= */

        const backgroundSymbols = [

            "🌸",
            "💕",
            "💗",
            "✨",
            "🌷"

        ];


        function createBackgroundParticle() {

            const particle =
                document.createElement(
                    "span"
                );


            particle.textContent =
                backgroundSymbols[
                    Math.floor(
                        Math.random() *
                        backgroundSymbols.length
                    )
                ];


            particle.style.left =
                Math.random() *
                100 +
                "%";


            particle.style.fontSize =
                (
                    15 +
                    Math.random() *
                    18
                ) +
                "px";


            const duration =
                7 +
                Math.random() *
                7;


            particle.style.animationDuration =
                duration +
                "s";


            document
                .getElementById(
                    "background"
                )
                .appendChild(
                    particle
                );


            setTimeout(
                function () {

                    particle.remove();

                },
                (duration + 1) *
                1000
            );

        }


        setInterval(
            createBackgroundParticle,
            700
        );


        for (
            let i = 0;
            i < 7;
            i++
        ) {

            setTimeout(
                createBackgroundParticle,
                i * 250
            );

        }

    </script>

</body>

</html>
